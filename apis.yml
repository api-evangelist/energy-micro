name: Energy Micro
description: 'Energy Micro was a Norwegian fabless semiconductor company, founded in
  2007 and headquartered in Oslo, best known for its EFM32 "Gecko" family of energy-friendly
  32-bit ARM Cortex-M microcontrollers and the EFR radio products targeting low-power
  embedded and IoT applications. The company was acquired by Silicon Labs in 2013 and
  fully absorbed into that company''s product lines; its former energymicro.com domain
  now redirects to silabs.com. It was surfaced as a portfolio company of Northzone and
  added to the API Evangelist network as a stub. Enrichment found no independent, first-party
  API, developer portal, OpenAPI, SDK, or MCP surface for Energy Micro as a standalone
  entity — the developer tooling for its EFM32 line lives under Silicon Labs today.'
